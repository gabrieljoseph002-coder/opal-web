<style>
:root {
  --bg: #111111; --panel: #1a1a1a; --panel2: #232323; --line: #333333; --text: #ffffff; --muted: #b5b5b5;
  --accent: #d1432a; --accent-weak: rgba(209, 67, 42, .16); --solar: #fbbf24; --grid: #9ca3af; --home: #60a5fa; --batt: #a78bfa;
  --bad: #f87171; --bad-weak: #3a1a1a; --warn: #fbbf24; --warn-weak: #3a2c12; --ok: #b9ecc6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --panel: #1a1a1a; --panel2: #232323; --line: #333333; --text: #ffffff; --muted: #b5b5b5;
  --accent: #d1432a; --accent-weak: rgba(209, 67, 42, .16); --solar: #fbbf24; --grid: #9ca3af; --home: #60a5fa; --batt: #a78bfa;
  --bad: #f87171; --bad-weak: #3a1a1a; --warn: #fbbf24; --warn-weak: #3a2c12; --ok: #b9ecc6;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --panel: #1a1a1a; --panel2: #232323; --line: #333333; --text: #ffffff; --muted: #b5b5b5;
  --accent: #d1432a; --accent-weak: rgba(209, 67, 42, .16); --solar: #fbbf24; --grid: #9ca3af; --home: #60a5fa; --batt: #a78bfa;
  --bad: #f87171; --bad-weak: #3a1a1a; --warn: #fbbf24; --warn-weak: #3a2c12; --ok: #b9ecc6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
nav.side { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 800; font-size: 18px; padding: 4px 10px 14px; letter-spacing: .2px; }
.brand span { color: var(--accent); }
nav a.tab { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 9px; color: var(--text); text-decoration: none; margin-bottom: 2px; }
nav a.tab svg { width: 20px; height: 20px; flex: none; }
nav a.tab.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
nav a.tab .count { margin-left: auto; background: var(--bad); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 7px; }
.side-foot { position: absolute; bottom: 14px; left: 18px; right: 12px; font-size: 12px; color: var(--muted); }
main { padding: 20px 24px 90px; max-width: 1180px; width: 100%; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1.3fr 1fr; }
input, select, button, textarea { font: inherit; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px 10px; }
input, select { min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
label.f input, label.f select { color: var(--text); }
button { cursor: pointer; background: var(--panel2); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
:root[data-theme="dark"] button.primary { color: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #ffffff; } }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.kpi span { font-size: 12px; color: var(--muted); display: block; }
.kpi b { font-size: 24px; }
.kpi small { color: var(--muted); }
.flow { width: 100%; max-width: 520px; display: block; margin: 0 auto; }
.flow text { fill: var(--text); font-size: 13px; }
.flow .lbl { fill: var(--muted); font-size: 11px; }
.flow .line { stroke: var(--line); stroke-width: 4; fill: none; }
.flow .live { stroke-width: 4; fill: none; stroke-dasharray: 6 10; animation: dash 1s linear infinite; }
.flow .live.rev { animation-direction: reverse; }
@keyframes dash { to { stroke-dashoffset: -16; } }
@media (prefers-reduced-motion: reduce) { .flow .live { animation: none; } }
.alert { padding: 8px 10px; border-radius: 9px; margin: 6px 0; font-size: 14px; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.alert.bad { background: var(--bad-weak); color: var(--bad); }
.alert.warn { background: var(--warn-weak); color: var(--warn); }
.alert.ok { background: var(--accent-weak); color: var(--ok); }
.alert a { color: inherit; font-size: 12px; white-space: nowrap; }
.dev { cursor: pointer; transition: border-color .15s; }
.dev:hover { border-color: var(--accent); }
.dev .pw { font-size: 26px; font-weight: 700; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
.pill.bad { background: var(--bad-weak); color: var(--bad); } .pill.warn { background: var(--warn-weak); color: var(--warn); } .pill.ok { background: var(--accent-weak); color: var(--ok); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.chart { width: 100%; height: 180px; }
.micros { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.micro { border-radius: 8px; padding: 6px; text-align: center; font-size: 12px; color: #fff; }
details.guide { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
details.guide summary { cursor: pointer; font-weight: 600; }
details.guide ol { margin: 8px 0 4px; padding-left: 20px; }
details.guide li { margin: 4px 0; }
.safety { background: var(--warn-weak); color: var(--warn); border-radius: 9px; padding: 8px 10px; font-size: 13px; margin: 8px 0; }
.calc .out { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel2); font-size: 14px; }
.calc .out b.big { font-size: 20px; }
.calc .fields { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.links a { display: inline-block; margin: 2px 10px 2px 0; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; max-width: 440px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.5); }
video { width: 100%; border-radius: 9px; margin-top: 8px; }
.demo-tag { background: var(--batt); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 99px; }
.hidden { display: none !important; }
.err { color: var(--warn); font-size: 13px; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  nav.side { position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: auto; display: flex; padding: 4px; z-index: 5; border-right: 0; border-top: 1px solid var(--line); overflow-x: auto; }
  .brand, .side-foot { display: none; }
  nav a.tab { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 8px; min-width: 64px; }
  nav a.tab .count { position: absolute; margin: 0 0 0 18px; }
  main { padding: calc(14px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); }
  nav.side { padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .grid2 { grid-template-columns: 1fr; }
}
</style>

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
#phOut h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
#phOut .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px}</style>
<script>
// Opal house lookup: shared by the Opal desktop app, the phone app and the Energy Hub.
// Sources (all public, no keys): NC OneMap parcels (every NC county), City of Raleigh permits, FEMA flood zones.
// The last lookup is saved on the device and stays on screen until "Clear".
(function () {
  const PARCELS = 'https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1/query';
  const RALEIGH = 'https://services.arcgis.com/v400IkDOw1ad7Yad/ArcGIS/rest/services';
  const FEMA = 'https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28/query';
  const SUF = { STREET: 'ST', ROAD: 'RD', DRIVE: 'DR', CIRCLE: 'CIR', LANE: 'LN', AVENUE: 'AVE', COURT: 'CT', PLACE: 'PL', BOULEVARD: 'BLVD', TRAIL: 'TRL', PARKWAY: 'PKWY', TERRACE: 'TER', HIGHWAY: 'HWY', NORTH: 'N', SOUTH: 'S', EAST: 'E', WEST: 'W' };
  const SOLAR = /solar|photo ?volt|\bpv\b|battery|powerwall|energy storage|\bess\b|inverter/i;
  const ELEC = /service (upgrade|change)|\bpanel\b|\d+ ?amp|generator|ev charg|meter base|rewir|electric/i;
  const ROOF = /roof|reroof|shingle/i;
  const KEY = 'opal.house.last';
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (n) => (n == null || n === '' ? '-' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 }));
  const save = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } };
  const day = (ms) => (ms ? new Date(ms).toISOString().slice(0, 10) : '');

  function parseAddr(text) {
    const raw = String(text || '').toUpperCase().split(',');
    const street = raw[0].replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean).map((w) => SUF[w] || w).join(' ');
    const city = (raw[1] || '').replace(/[^A-Z ]/g, '').trim();
    return { street, city };
  }
  async function getJSON(url, params, ms = 15000) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
    const full = url + '?' + new URLSearchParams(params);
    if (window.opal && window.opal.fetchJSON) { // desktop app: let the app fetch (no browser CORS limits)
      try { return await Promise.race([window.opal.fetchJSON(full), new Promise((_, no) => setTimeout(() => no(new Error('timed out')), ms))]); }
      finally { clearTimeout(t); }
    }
    let r;
    try { r = await fetch(full, { signal: ctl.signal }); }
    catch (e) { throw new Error(e.name === 'AbortError' ? 'timed out' : 'network error'); }
    finally { clearTimeout(t); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function parcel(addr) {
    const { street, city } = parseAddr(addr);
    if (!street) throw new Error('Type the street number and name, then a comma and the city.');
    const where = `siteadd = '${street.replace(/'/g, '')}'` + (city ? ` AND scity = '${city}'` : '');
    const d = await getJSON(PARCELS, { where, outFields: 'parno,nparno,siteadd,scity,szip,cntyname,structyear,struct,multistruc,structno,parval,improvval,landval,parvaltype,saledatetx,saledate,gisacres,parusedsc2,parusedesc,owntype,subdivisio,revdatetx', returnGeometry: 'true', outSR: '4326', resultRecordCount: '3', f: 'json' });
    const f = d.features && d.features[0];
    if (!f) throw new Error('Not found in NC county records. Use the street number and name, then the city (e.g. "2708 Saltaire Ave, Durham").');
    let lat = null, lon = null;
    const ring = f.geometry && f.geometry.rings && f.geometry.rings[0];
    if (ring && ring.length) { lon = ring.reduce((s, p) => s + p[0], 0) / ring.length; lat = ring.reduce((s, p) => s + p[1], 0) / ring.length; }
    return { ...f.attributes, lat, lon };
  }

  async function raleighPermits(pin, street) {
    const rows = [];
    const pinClean = String(pin || '').replace(/[^0-9A-Za-z]/g, '');
    const st = String(street || '').replace(/'/g, '').toUpperCase();
    const where = [pinClean && `pin='${pinClean}'`, st && `upper(originaladdress1)='${st}'`].filter(Boolean).join(' OR ');
    let ok = 0;
    for (const [kind, layer, extra, w] of [['Building', 'Building_Permits', ',estprojectcost', where], ['Trade', 'Permits_Other_Than_Buildings', '', pinClean ? `pin='${pinClean}'` : where]]) {
      let d;
      try { d = await getJSON(`${RALEIGH}/${layer}/FeatureServer/0/query`, { where: w, outFields: 'permitnum,issueddate,permittype,description,proposedworkdescription,contractorcompanyname,numberstories,statuscurrentmapped' + extra, returnGeometry: 'false', f: 'json' }, 25000); }
      catch { continue; }
      if (!d || d.error) continue;
      ok++;
      for (const ft of d.features || []) {
        const a = ft.attributes, text = `${a.description || ''} ${a.proposedworkdescription || ''} ${a.permittype || ''}`;
        rows.push({ date: day(a.issueddate), type: (a.permittype || kind), work: (a.proposedworkdescription || a.description || '').trim(), by: (a.contractorcompanyname || '').trim(), cost: a.estprojectcost || null, stories: a.numberstories || null,
          tag: SOLAR.test(text) ? 'solar' : ROOF.test(text) ? 'roof' : ELEC.test(text) ? 'electrical' : '' });
      }
    }
    if (!ok) throw new Error('Raleigh permits unavailable');
    const seen = new Set();
    return rows.sort((a, b) => (a.date < b.date ? 1 : -1)).filter((r) => { const k = r.date + r.work.slice(0, 30); if (seen.has(k)) return false; seen.add(k); return true; });
  }

  const DURHAM = 'https://services2.arcgis.com/G5vR3cOjh6g2Ed8E/ArcGIS/rest/services/Parcels_NEW/FeatureServer/0/query';
  async function durham(siteadd) {
    const d = await getJSON(DURHAM, { where: `LOCATION_ADDR='${String(siteadd).replace(/'/g, '')}'`, outFields: 'HEATED_AREA,PERMIT_DATE,PERMIT_NUMBER,ZONING,PKG_SALE_DATE,PKG_SALE_PRICE,NEIGHBORHOOD,HISTORIC_VALUE_DEFERRED', returnGeometry: 'false', f: 'json' });
    const a = d.features && d.features[0] && d.features[0].attributes;
    return a ? { heated: a.HEATED_AREA, zoning: a.ZONING, salePrice: a.PKG_SALE_PRICE, saleDate: day(a.PKG_SALE_DATE), neighborhood: a.NEIGHBORHOOD, lastPermit: a.PERMIT_DATE ? day(a.PERMIT_DATE) + (a.PERMIT_NUMBER ? ' #' + a.PERMIT_NUMBER : '') : '', historic: a.HISTORIC_VALUE_DEFERRED > 0 } : null;
  }

  async function flood(lat, lon) {
    const d = await getJSON(FEMA, { geometry: `${lon},${lat}`, geometryType: 'esriGeometryPoint', inSR: '4326', spatialRel: 'esriSpatialRelIntersects', outFields: 'FLD_ZONE,ZONE_SUBTY,SFHA_TF', returnGeometry: 'false', f: 'json' });
    const a = d.features && d.features[0] && d.features[0].attributes;
    return a ? { zone: a.FLD_ZONE, sub: a.ZONE_SUBTY, special: a.SFHA_TF === 'T' } : { zone: 'Not mapped / minimal', special: false };
  }

  function roofEstimate(year, permits) {
    const roofP = permits.find((p) => p.tag === 'roof');
    const now = new Date().getFullYear();
    if (roofP) { const age = now - +roofP.date.slice(0, 4); return { age, basis: `roof permit ${roofP.date}${roofP.by ? ' by ' + roofP.by : ''}`, sure: true }; }
    if (!year) return null;
    const age = now - year;
    // Asphalt shingles last ~20-25 years in NC; an older house has likely been reroofed at least once.
    const est = age <= 22 ? age : age % 22;
    return { age: est, basis: age <= 22 ? 'original roof (from year built)' : `estimate: likely reroofed, original house ${age} yrs old (no roof permit on file)`, sure: false };
  }

  function watchFor(p, roof, permits, fz) {
    const out = [], y = +p.structyear || 0;
    if (roof && !roof.sure && (+p.structyear || 0) && new Date().getFullYear() - +p.structyear > 22) {
      out.push(['warn', `Roof age unknown: no roof permit on file and the house is ${new Date().getFullYear() - +p.structyear} yrs old, so it has likely been reroofed at least once. Inspect the shingles (granule loss, curling, soft decking) before quoting solar.`]);
    } else if (roof) {
      if (roof.age >= 18) out.push(['bad', `Roof about ${roof.age} yrs old: shingles near end of life (20-25 yrs). Plan for reroof before or with solar; R&R likely if solar goes on now.`]);
      else if (roof.age >= 12) out.push(['warn', `Roof about ${roof.age} yrs old: check shingle condition; may need replacing during the solar system's life.`]);
      else out.push(['ok', `Roof about ${roof.age} yrs old: good for solar.`]);
    }
    if (y && y <= 1990) out.push(['warn', 'Built 1990 or earlier: check for FPE/Zinsco panels, small service (100A or less), water-pipe-only grounding.']);
    if (y >= 1965 && y <= 1973) out.push(['bad', 'Built 1965-1973: possible aluminum branch wiring. Inspect before any electrical work.']);
    if (y && y < 1978) out.push(['warn', 'Built before 1978: possible lead paint; use lead-safe practices when drilling or cutting.']);
    if (y && y < 1950) out.push(['warn', 'Built before 1950: possible knob-and-tube wiring and rafters that need a structural check.']);
    if (+p.structno > 1 || p.multistruc === 'Y') out.push(['ok', `${p.structno || 'Multiple'} structures on the lot: detached garage or shed could host panels or a battery.`]);
    const sol = permits.filter((x) => x.tag === 'solar');
    if (sol.length) { const s = sol[sol.length - 1]; out.push(['ok', `Solar already permitted ${s.date}${s.by ? ' by ' + s.by : ''}. Warranty and monitoring may still be with that installer.`]); }
    if (p.__county && p.__county.historic) out.push(['bad', 'Historic property (deferred value): solar visible from the street may need historic commission approval.']);
    if (fz && fz.special) out.push(['bad', `FEMA flood zone ${fz.zone}: equipment height and disconnect location rules apply; flood insurance likely required.`]);
    return out;
  }

  async function lookup(addr) {
    const p = await parcel(addr);
    const result = { address: addr, when: new Date().toISOString(), p, permits: [], permitNote: '', flood: null };
    const isRaleigh = /RALEIGH/i.test(p.scity || '');
    if (!isRaleigh) result.permitNote = `Live permit history is wired for the City of Raleigh. For ${p.cntyname || 'this'} County, use the permit portal link below.`;
    // Run the extra sources side by side; any one failing or slow doesn't block the others.
    const [perm, fz, cty] = await Promise.allSettled([
      isRaleigh ? raleighPermits(p.parno, p.siteadd) : Promise.resolve([]),
      p.lat ? flood(p.lat, p.lon) : Promise.resolve(null),
      /DURHAM/i.test(p.cntyname || '') ? durham(p.siteadd) : Promise.resolve(null),
    ]);
    if (perm.status === 'fulfilled') result.permits = perm.value; else result.permitNote = "Couldn't reach Raleigh permit records right now.";
    result.flood = fz.status === 'fulfilled' ? fz.value : null;
    result.county = cty.status === 'fulfilled' ? cty.value : null;
    if (result.county && result.county.lastPermit) result.permitNote = `Durham County's latest permit on this parcel: ${result.county.lastPermit}. Full history in the Durham permit portal below.`;
    result.roof = roofEstimate(+p.structyear || 0, result.permits);
    p.__county = result.county;
    result.watch = watchFor(p, result.roof, result.permits, result.flood);
    delete p.__county;
    save(result);
    return result;
  }

  function linksFor(p) {
    const q = encodeURIComponent(`${p.siteadd}, ${p.scity}, NC`);
    const L = [['Google Maps', `https://www.google.com/maps/search/?api=1&query=${q}`]];
    if (p.lat) L.push(['Street View', `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`]);
    const c = (p.cntyname || '').toUpperCase();
    if (c === 'WAKE') L.push(['Wake real estate record', `https://services.wake.gov/realestate/Account.asp?id=&stype=addr&stnum=&stname=${encodeURIComponent(p.siteadd || '')}`], ['Raleigh permit portal', 'https://permitportal.raleighnc.gov'], ['Wake permits', 'https://www.wake.gov/departments-government/permits-inspections']);
    if (c === 'DURHAM') L.push(['Durham tax record', 'https://property.spatialest.com/nc/durham'], ['Durham permits', 'https://www.durhamnc.gov/1086/Building-Permits']);
    if (c === 'ORANGE') L.push(['Orange County permits', 'https://www.orangecountync.gov/1004/Permits-Inspections']);
    if (c === 'MECKLENBURG') L.push(['Mecklenburg permits', 'https://www.mecknc.gov/LUESA/CodeEnforcement']);
    return L;
  }

  function html(r) {
    if (!r) return '';
    const p = r.p, y = +p.structyear || null, age = y ? new Date().getFullYear() - y : null;
    const tag = (t) => (t ? `<span class="pill ${t === 'solar' ? 'ok' : t === 'roof' ? 'warn' : ''}">${esc(t)}</span>` : '');
    return `<div class="house">
      <div class="house-head"><b>${esc(p.siteadd)}, ${esc(p.scity)} ${esc(p.szip || '')}</b><span>${esc(p.cntyname)} County · parcel ${esc(p.parno)} · looked up ${esc(r.when.slice(0, 16).replace('T', ' '))}</span></div>
      <div class="kpis">
        <div class="kpi"><span>Built</span><b>${y || '-'}</b><small>${age ? age + ' yrs old' : (y ? '' : 'not published by county')}</small></div>
        <div class="kpi"><span>Roof age</span><b>${r.roof ? (r.roof.sure ? '' : '~') + r.roof.age + ' yrs' + (r.roof.sure ? '' : '?') : '-'}</b><small>${r.roof ? esc(r.roof.basis) : 'no data'}</small></div>
        <div class="kpi"><span>Last sold</span><b>${esc((p.saledatetx || '-').slice(0, 10))}</b><small>${p.owntype ? esc(p.owntype) + ' owner' : ''}</small></div>
        <div class="kpi"><span>County value</span><b>$${num(p.parval)}</b><small>house $${num(p.improvval)} · land $${num(p.landval)}</small></div>
        <div class="kpi"><span>Lot</span><b>${p.gisacres != null ? (+p.gisacres).toFixed(2) + ' ac' : '-'}</b><small>${esc(p.parusedsc2 || p.parusedesc || '')}</small></div>
        <div class="kpi"><span>Flood zone</span><b>${r.flood ? esc(r.flood.zone) : '-'}</b><small>${r.flood && r.flood.special ? 'special flood hazard area' : 'FEMA'}</small></div>
      </div>
      ${r.county ? `<div class="kpis">
        <div class="kpi"><span>Heated area</span><b>${num(r.county.heated)} ft²</b></div>
        <div class="kpi"><span>Zoning</span><b>${esc(r.county.zoning || '-')}</b></div>
        <div class="kpi"><span>Sale price</span><b>${r.county.salePrice ? '$' + num(r.county.salePrice) : '-'}</b><small>${esc(r.county.saleDate || '')}</small></div>
        <div class="kpi"><span>Neighborhood</span><b style="font-size:13px">${esc(r.county.neighborhood || '-')}</b></div></div>` : ''}
      ${p.subdivisio ? `<p class="sub">Subdivision: ${esc(p.subdivisio)}${p.structno ? ' · ' + esc(p.structno) + ' structure(s)' : ''}</p>` : ''}
      <h3>Watch for</h3>${(r.watch || []).map(([lvl, t]) => `<div class="alert ${lvl}"><span>${esc(t)}</span></div>`).join('') || '<p class="sub">Nothing to flag.</p>'}
      <h3>Permit history</h3>${r.permits.length ? `<table><tr><th>Date</th><th>Type</th><th>Work</th><th>By</th></tr>${r.permits.slice(0, 40).map((x) => `<tr><td>${esc(x.date)}</td><td>${esc(x.type)} ${tag(x.tag)}</td><td>${esc(x.work.slice(0, 120))}</td><td>${esc(x.by)}</td></tr>`).join('')}</table>` : `<p class="sub">${esc(r.permitNote || 'No permits on file (outside city limits, or work never permitted).')}</p>`}
      <div class="links">${linksFor(p).map(([t, u]) => `<a href="${esc(u)}" data-ext="1">${esc(t)}</a>`).join('')}</div>
      <p class="note">County tax records (NC OneMap), City of Raleigh permits, FEMA flood maps. Roof age without a roof permit is an estimate. These are things to check, not findings.</p>
    </div>`;
  }

  const GEO = 'https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer';
  async function suggest(text) {
    if (!text || text.length < 4) return [];
    const d = await getJSON(GEO + '/suggest', { text, f: 'json', countryCode: 'USA', category: 'Address', location: '-78.8,35.85', maxSuggestions: '6' });
    return (d.suggestions || []).filter((x) => /, NC|North Carolina/i.test(x.text)).map((x) => x.text);
  }
  function tidy(t) { // "123 Main St, Raleigh, North Carolina, 27601" -> "123 Main St, Raleigh"
    const parts = String(t).split(',').map((x) => x.trim());
    return parts.length >= 2 ? parts[0] + ', ' + parts[1] : t;
  }

  // Mounts the lookup into a container. opts.open(url) opens links (app window / in-app browser).
  function mount(el, opts = {}) {
    el.innerHTML = `<div class="row"><input id="houseAddr" list="houseSug" autocomplete="off" placeholder="Start typing an address…" style="flex:1 1 280px"><datalist id="houseSug"></datalist>
      <button class="primary btn" id="houseGo">Look up</button><button class="btn ghost" id="houseClear">Clear</button></div><div id="houseOut"></div>`;
    const out = el.querySelector('#houseOut'), input = el.querySelector('#houseAddr');
    const show = (r) => { out.innerHTML = html(r); out.querySelectorAll('[data-ext]').forEach((a) => a.addEventListener('click', (e) => { if (opts.open) { e.preventDefault(); opts.open(a.href); } })); };
    const last = load();
    if (last) { input.value = last.address; show(last); }
    const go = async () => {
      if (!input.value.trim()) return;
      out.innerHTML = '<p class="sub">Looking up county records, permits and flood maps…</p>';
      try { show(await lookup(input.value)); } catch (e) { out.innerHTML = `<div class="alert warn"><span>${esc(e.message || e)}</span></div>`; }
    };
    el.querySelector('#houseGo').onclick = go;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    let t = null;
    const dl = el.querySelector('#houseSug');
    input.addEventListener('input', () => {
      clearTimeout(t);
      if (dl.querySelector(`option[value="${CSS.escape(input.value)}"]`)) { input.value = tidy(input.value); go(); return; }
      t = setTimeout(async () => { try { dl.innerHTML = (await suggest(input.value)).map((x) => `<option value="${esc(x)}">`).join(''); } catch {} }, 250);
    });
    el.querySelector('#houseClear').onclick = () => { try { localStorage.removeItem(KEY); } catch {} input.value = ''; out.innerHTML = ''; };
  }

  window.OpalHouse = { lookup, html, mount, last: load };
})();

</script>
</head>
<body>
<div class="app">
  <nav class="side" id="nav">
    <div class="brand"><span>Opal</span> Energy Hub</div>
  </nav>
  <main id="main"></main>
</div>

<dialog id="addDialog">
  <h2>Add a device by IP</h2>
  <div class="row"><input id="addHost" placeholder="IP address, e.g. 192.168.1.50" style="flex:1"></div>
  <div class="row" style="margin-top:8px">
    <select id="addType">
      <option value="sunspec">SolarEdge / SMA / Fronius / Generac (Modbus SunSpec)</option>
      <option value="enphase">Enphase IQ Gateway</option>
      <option value="tesla">Tesla Gateway / Powerwall</option>
      <option value="fronius">Fronius (Solar API)</option>
      <option value="rs485">RS485 cable (USB adapter, SunSpec Modbus RTU)</option>
    </select>
    <input id="addPort" placeholder="Modbus port (1502)" style="width:150px">
  </div>
  <div class="row" style="margin-top:12px"><button class="primary" id="addGo">Add</button><button onclick="addDialog.close()">Cancel</button></div>
  <div class="err" id="addErr"></div>
</dialog>

<dialog id="connectDialog">
  <h2 id="connectTitle">Connect</h2>
  <p class="sub" id="connectHelp"></p>
  <div class="row"><input id="secret" placeholder="Password or token" autocomplete="off" style="flex:1"></div>
  <div class="row" style="margin-top:8px">
    <button id="qrBtn">Scan sticker QR</button>
    <label class="sub"><input type="file" accept="image/*" id="qrPhoto" hidden><u style="cursor:pointer">Photo of label</u></label>
  </div>
  <video id="qrVideo" class="hidden" playsinline></video>
  <div id="enphaseLogin" class="hidden">
    <p class="sub">Or fetch an owner token with the homeowner's Enlighten login:</p>
    <div class="row"><input id="enEmail" placeholder="Owner email"><input id="enPass" type="password" placeholder="Password"><input id="enSerial" placeholder="Gateway serial"></div>
  </div>
  <p class="sub">Check what the camera read before connecting. Passwords stay in memory only.</p>
  <div class="row"><button class="primary" id="connectGo">Connect</button><button id="connectCancel">Cancel</button></div>
  <div id="connectErr" class="err"></div>
</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d = 0) => v === null || v === undefined || isNaN(v) ? "-" : Number(v).toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: d});
const W = v => v === null || v === undefined ? "-" : Math.abs(v) >= 1000 ? num(v / 1000, 2) + " kW" : num(v) + " W";
let S = null, connectId = null, stream = null, net = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

// ------------------------------------------------------------------ navigation
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2"/>',
  devices: '<rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2"/>',
  troubleshoot: '<path d="M14 7a4 4 0 0 1-5.3 5.3L4 17l3 3 4.7-4.7A4 4 0 0 1 17 10l-3-3z" fill="none" stroke="currentColor" stroke-width="2"/>',
  tools: '<rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2" stroke="currentColor" stroke-width="2"/>',
  wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="19.5" r="1.5" fill="currentColor"/>',
  accounts: '<circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/>',
  reports: '<path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12h6M9 16h6" stroke="currentColor" stroke-width="2"/>',
  settings: '<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2"/>'
};
const PAGES = [["home","Home"],["devices","Devices"],["wifi","Wi-Fi names"],["troubleshoot","Troubleshoot"],["tools","Tools"],["accounts","Accounts"],["reports","Reports"],["settings","Settings"]];
$("nav").insertAdjacentHTML("beforeend", PAGES.map(([k, t]) =>
  `<a class="tab" href="#${k}" data-page="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg><span>${t}</span>${k === "home" ? '<span class="count hidden" id="alertCount"></span>' : ""}</a>`).join("") +
  `<div class="side-foot">Read-only: never changes device settings.<br><span id="demoFoot"></span></div>`);
function route() { return (location.hash.slice(1) || "home").split("/"); }
addEventListener("hashchange", render);

// ------------------------------------------------------------------ data refresh
async function refresh() {
  try { S = await api("/api/state"); if (!S || !Array.isArray(S.devices)) S = null; } catch (e) { S = null; }  // no hub (web/phone copy): phone mode
  document.querySelectorAll("a.tab").forEach(a => a.classList.toggle("on", a.dataset.page === route()[0]));
  if (S) {
    const n = S.site.alerts;
    $("alertCount").textContent = n; $("alertCount").classList.toggle("hidden", !n);
    $("demoFoot").innerHTML = S.demo ? '<span class="demo-tag">DEMO: fake devices</span>' : "";
  }
  const page = route()[0];
  // Don't redraw over a house lookup the user is reading (it used to vanish every 5 s).
  if (!S && document.getElementById("phOut")) return;
  if (document.getElementById("phOut")?.innerHTML.trim()) return;
  if (["home", "devices", "accounts"].includes(page) && !document.activeElement.matches("input,select,textarea")) render();
}
setInterval(refresh, 5000);

function render() {
  document.querySelectorAll("a.tab").forEach(a => a.classList.toggle("on", a.dataset.page === route()[0]));
  const [page, arg] = route();
  if (!S && page !== "tools" && page !== "troubleshoot" && page !== "wifi") { phoneHome(); return; }
  const fn = {home, wifi, devices: arg ? () => deviceDetail(decodeURIComponent(arg)) : devices, troubleshoot, tools, accounts, reports, settings}[page] || home;
  fn();
}

// ------------------------------------------------------------------ Home
function permissionPanel() {
  if (S.permission) return "";
  return `<div class="panel"><h2>Before you connect</h2>
    <p class="sub">Get the homeowner's written permission ("I authorize Opal Solutions to run a read-only diagnostic on my solar/battery system").</p>
    <div class="row"><input id="customer" placeholder="Customer name" style="flex:1 1 200px"><input id="jobAddr" placeholder="Job address (for Google Sunroof data)" style="flex:2 1 260px"><input id="confirm" placeholder="Type YES" style="width:120px">
    <button class="primary" onclick="givePermission()">Confirm</button></div></div>`;
}

function flowSvg(f) {
  const nodes = {solar: [260, 50, "Solar", "var(--solar)"], grid: [70, 170, "Grid", "var(--grid)"], home: [450, 170, "Home", "var(--home)"], battery: [260, 290, "Battery", "var(--batt)"]};
  const val = {solar: f.solar, grid: f.grid, home: f.home, battery: f.battery};
  const sub = {solar: "producing", grid: f.grid == null ? "no meter" : f.grid > 20 ? "importing" : f.grid < -20 ? "exporting" : "idle",
    home: f.home == null ? "no meter" : "using", battery: f.battery == null ? "none" : f.battery > 20 ? "discharging" : f.battery < -20 ? "charging" : "idle"};
  // flow toward center (+) or away (-): solar in, grid in when importing, battery in when discharging, home always out
  const dir = {solar: (f.solar || 0) > 20 ? 1 : 0, grid: (f.grid || 0) > 20 ? 1 : (f.grid || 0) < -20 ? -1 : 0,
    battery: (f.battery || 0) > 20 ? 1 : (f.battery || 0) < -20 ? -1 : 0, home: (f.home || 0) > 20 ? -1 : 0};
  const cx = 260, cy = 170;
  let lines = "", boxes = "";
  for (const [k, [x, y, name, color]] of Object.entries(nodes)) {
    lines += `<path class="line" d="M${x},${y} L${cx},${cy}"/>`;
    if (dir[k]) lines += `<path class="live ${dir[k] < 0 ? "rev" : ""}" stroke="${color}" d="M${x},${y} L${cx},${cy}"/>`;
    boxes += `<g><circle cx="${x}" cy="${y}" r="38" fill="var(--panel)" stroke="${color}" stroke-width="3"/>
      <text x="${x}" y="${y - 4}" text-anchor="middle" font-weight="700">${val[k] == null ? "-" : W(Math.abs(val[k]))}</text>
      <text class="lbl" x="${x}" y="${y + 13}" text-anchor="middle">${sub[k]}</text>
      <text class="lbl" x="${x}" y="${y + 56}" text-anchor="middle" style="font-size:12px;fill:var(--text)">${name}${k === "battery" && f.soc != null ? " " + f.soc + "%" : ""}</text></g>`;
  }
  return `<svg class="flow" viewBox="0 0 520 350" role="img" aria-label="Energy flow">${lines}<circle cx="${cx}" cy="${cy}" r="10" fill="var(--accent)"/>${boxes}</svg>`;
}

function allFlags() {
  const out = [];
  for (const d of S.devices) for (const f of d.reading?.flags || []) out.push({...f, dev: d});
  for (const d of S.devices) if (d.error && !(d.needs && !d.connected)) out.push({level: "warn", text: `${d.label}: ${d.error}`, dev: d});
  return out.sort((a, b) => (a.level === "bad" ? 0 : 1) - (b.level === "bad" ? 0 : 1));
}

function flatten(obj, prefix = "", out = []) {
  for (const [k, v] of Object.entries(obj || {})) {
    if (k === "inverters" || k === "strings") continue;
    if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, prefix + k + " · ", out);
    else if (!Array.isArray(v)) out.push([prefix + k.replace(/_/g, " "), v]);
  }
  return out;
}

  if (points.length < 2) return '<p class="sub">Collecting readings... the chart fills in over the next few minutes.</p>';
  const ws = points.map(p => p[1] || 0), t0 = points[0][0], t1 = points[points.length - 1][0];
  const max = Math.max(...ws, 1), x = t => (t - t0) / Math.max(1, t1 - t0) * 580 + 10, y = v => 160 - v / max * 140;
  const line = points.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1] || 0).toFixed(1)}`).join("");
  const mins = Math.round((t1 - t0) / 60);
  return `<svg class="chart" viewBox="0 0 600 180" preserveAspectRatio="none">
    <path d="${line} L${x(t1)},160 L10,160 Z" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <text x="12" y="16" style="fill:var(--muted);font-size:11px">${W(max)}</text><text x="12" y="176" style="fill:var(--muted);font-size:11px">${mins} min ago</text>
    <text x="560" y="176" style="fill:var(--muted);font-size:11px">now</text></svg>`;
}

const UNIT_GUESS = {"vac": "VAC", "v ac": "VAC", "acv": "VAC", "vdc": "VDC", "v dc": "VDC", "dcv": "VDC", "v": "VDC", "mv": "mV",

const normUnit = u => UNIT_GUESS[String(u || "").trim().toLowerCase()] || String(u || "").trim();

function drawMeter() {
  const ms = (S && S.measurements) || [];
  const point = ms.length ? "" : '<p class="sub" style="margin-top:8px">No readings yet.</p>';

  if (series.length > 3) {
    const vals = series.map(m => m.value), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const path = series.map((m, i) => `${i ? "L" : "M"}${(i / (series.length - 1) * 580 + 10).toFixed(1)},${(150 - (m.value - lo) / span * 130).toFixed(1)}`).join("");
    mini = `<svg class="chart" viewBox="0 0 600 170" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text x="12" y="14" style="fill:var(--muted);font-size:11px">${num(hi, 2)} ${esc(series[0].unit)}</text><text x="12" y="166" style="fill:var(--muted);font-size:11px">${num(lo, 2)} (${series.length} logged points)</text></svg>`;
  }
  $("mTable").innerHTML = point + mini + (ms.length ? `<table style="margin-top:8px"><tr><th>Time</th><th>Test point</th><th>Reading</th><th>Check</th></tr>
    ${ms.slice(-40).reverse().map(m => `<tr><td class="sub">${esc(m.t)}</td><td>${esc(m.point)}</td><td><b>${num(m.value, 3)}</b> ${esc(m.unit)}</td>
      <td>${m.level ? `<span class="pill ${esc(m.level)}">${esc(m.verdict)}</span>` : ""}</td></tr>`).join("")}</table>
    ${ms.length > 40 ? `<p class="note">Showing the latest 40 of ${ms.length}. All of them go in the report.</p>` : ""}` : "");
}

function parseMeterLog(text) {
  // Works with most meter exports: finds the column of numbers, a unit (own column or stuck to the number), and a time.
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const sep = [",", "\t", ";"].map(c => [c, (lines[0] || "").split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = lines.map(l => l.split(sep).map(c => c.replace(/^"|"$/g, "").trim()));
  const width = Math.max(...rows.map(r => r.length));
  const numRe = /^([-+]?\d*\.?\d+(?:e[-+]?\d+)?)\s*([a-zA-ZΩω°µ ]*)$/i;
  let valCol = -1, best = 0, timeCol = -1, unitCol = -1;
  const header = rows[0].map(h => h.toLowerCase());
  for (let c = 0; c < width; c++) {
    const hits = rows.slice(1).filter(r => numRe.test(r[c] || "")).length;
    const pref = /reading|value|primary|measure/.test(header[c] || "") ? rows.length : 0;
    if (hits + pref > best && !/time|date|index|no\.?$|#|sample/.test(header[c] || "")) { best = hits + pref; valCol = c; }
    if (timeCol < 0 && /time|date/.test(header[c] || "")) timeCol = c;
    if (unitCol < 0 && /unit/.test(header[c] || "")) unitCol = c;
  }
  if (valCol < 0) return [];
  const start = numRe.test(rows[0][valCol] || "") ? 0 : 1;
  const name = $("mCustom").value || $("mPoint").value || "Logged reading";
  return rows.slice(start).map(r => {
    const m = numRe.exec(r[valCol] || ""); if (!m) return null;
    return {t: timeCol >= 0 ? r[timeCol] : "", point: name, value: parseFloat(m[1]),
            unit: normUnit(unitCol >= 0 ? r[unitCol] : m[2] || $("mUnit").value), source: "import"};
  }).filter(Boolean);
}

function meterUI() {
  drawMeter();
  $("mPoint").onchange = () => {
    const p = $("mPoint").value;
    $("mUnit").value = /Voc|Battery/.test(p) ? "VDC" : /Isc/.test(p) ? "A" : /megger/.test(p) ? "MΩ" : /Frequency/.test(p) ? "Hz" : "VAC";
  };
  $("mAdd").onclick = async () => {
    const point = $("mCustom").value || $("mPoint").value;
    try {
      await api("/api/measure", {items: [{point, value: $("mValue").value.replace(",", "."), unit: $("mUnit").value}]});
      $("mValue").value = ""; $("mValue").focus(); await refresh(); drawMeter();
    } catch (e) { $("mMsg").textContent = e.message; }
  };
  $("mValue").onkeydown = e => { if (e.key === "Enter") $("mAdd").click(); };
  $("mFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const items = parseMeterLog(await f.text());
    if (!items.length) { $("mMsg").textContent = "Couldn't find readings in that file. Send it to Claude to add support for that meter."; return; }
    const r = await api("/api/measure", {items});
    $("mMsg").textContent = `Imported ${r.added} readings from ${f.name}.`; e.target.value = ""; await refresh(); drawMeter();
  };
  $("mClear").onclick = async () => { if (confirm("Clear all meter readings for this job?")) { await api("/api/measure", {clear: true}); await refresh(); drawMeter(); } };
}

// ------------------------------------------------------------------ Tools (field calculators)
// NEC Chapter 9 Table 8: DC resistance, uncoated conductors at 75 °C, ohms per 1000 ft.
const R8 = {cu: {"14": 3.07, "12": 1.93, "10": 1.21, "8": 0.764, "6": 0.491, "4": 0.308, "3": 0.245, "2": 0.194, "1": 0.154, "1/0": 0.122, "2/0": 0.0967, "3/0": 0.0766, "4/0": 0.0608, "250": 0.0515, "350": 0.0367, "500": 0.0258},
            al: {"12": 3.18, "10": 2.00, "8": 1.26, "6": 0.808, "4": 0.508, "3": 0.403, "2": 0.319, "1": 0.253, "1/0": 0.201, "2/0": 0.159, "3/0": 0.126, "4/0": 0.100, "250": 0.0847, "350": 0.0605, "500": 0.0424}};
// NEC Table 310.16, 75 °C column (amps). 240.4(D) small-conductor limits applied below.
const AMP75 = {cu: {"14": 20, "12": 25, "10": 35, "8": 50, "6": 65, "4": 85, "3": 100, "2": 115, "1": 130, "1/0": 150, "2/0": 175, "3/0": 200, "4/0": 230, "250": 255, "350": 310, "500": 380},
               al: {"12": 20, "10": 30, "8": 40, "6": 50, "4": 65, "3": 75, "2": 90, "1": 100, "1/0": 120, "2/0": 135, "3/0": 155, "4/0": 180, "250": 205, "350": 250, "500": 310}};
const OCPD_CAP = {cu: {"14": 15, "12": 20, "10": 30}, al: {"12": 15, "10": 25}};
// Table 310.15(B)(1)(1) ambient correction, 75 °C conductors (30 °C base)
const TEMP75 = [[30, 1], [35, .94], [40, .88], [45, .82], [50, .75], [55, .67], [60, .58], [65, .47], [70, .33]];
// Table 310.15(C)(1): more than 3 current-carrying conductors in a raceway
const FILL = [[3, 1], [6, .8], [9, .7], [20, .5], [30, .45], [40, .4], [9999, .35]];
const STD = [15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100, 110, 125, 150, 175, 200, 225, 250, 300, 350, 400];
const sizes = m => Object.keys(R8[m]);
const opts = (list, sel) => list.map(s => `<option ${s === sel ? "selected" : ""}>${s}</option>`).join("");
const v = id => parseFloat($(id).value);

const CALCS = [
  {id: "vd", title: "Voltage drop", nec: "NEC Ch. 9 Table 8; 210.19 / 215.2 informational notes (3% branch, 5% total)",
   html: `<label class="f">Amps<input id="vdA" value="32"></label><label class="f">One-way length (ft)<input id="vdL" value="80"></label>
     <label class="f">Volts<input id="vdV" value="240"></label><label class="f">Metal<select id="vdM"><option value="cu">Copper</option><option value="al">Aluminum</option></select></label>
     <label class="f">Wire size (AWG/kcmil)<select id="vdS">${opts(sizes("cu"), "8")}</select></label>
     <label class="f">System<select id="vdP"><option value="1">1-phase / DC</option><option value="3">3-phase</option></select></label>`,
   run() {
     const m = $("vdM").value, s = $("vdS").value, r = R8[m][s];
     if (!r) return "Pick a size available for that metal.";
     const k = $("vdP").value === "3" ? Math.sqrt(3) : 2, vd = k * v("vdL") * v("vdA") * r / 1000, pct = vd / v("vdV") * 100;
     let best = sizes(m).find(z => k * v("vdL") * v("vdA") * R8[m][z] / 1000 / v("vdV") * 100 <= 2);
     return `<b class="big">${num(vd, 2)} V drop (${num(pct, 2)}%)</b> · ${num(v("vdV") - vd, 1)} V at the load<br>
       ${pct > 3 ? "Over 3%: consider a bigger wire." : pct > 2 ? "OK for branch circuits; for PV aim for 2% or less." : "Good: under 2%."}
       ${best ? `<br>Smallest ${m === "cu" ? "copper" : "aluminum"} size for ≤ 2%: <b>${best}</b>` : ""}`;
   }},
  {id: "pvwire", title: "PV wire sizing (DC circuits)", nec: "NEC 690.8(A)/(B), Table 310.16 (75 °C), 310.15(B)(1)(1) and 310.15(C)(1), 240.4(D)",
   html: `<label class="f">Module Isc (A)<input id="pwI" value="13.9"></label><label class="f">Strings in parallel<input id="pwN" value="1"></label>
     <label class="f">Ambient °C (hottest)<input id="pwT" value="37"></label><label class="f">Conduit < 7/8" above roof?<select id="pwR"><option value="0">No / not on roof</option><option value="33">Yes (+33 °C, 310.15(B)(2))</option></select></label>
     <label class="f">Current-carrying conductors in raceway<input id="pwC" value="4"></label><label class="f">Metal<select id="pwM"><option value="cu">Copper</option><option value="al">Aluminum</option></select></label>`,
   run() {
     const iMax = v("pwI") * v("pwN") * 1.25, need = iMax * 1.25, t = v("pwT") + parseFloat($("pwR").value);
     const tf = (TEMP75.find(([c]) => t <= c) || [0, 0])[1], ff = FILL.find(([c]) => v("pwC") <= c)[1], m = $("pwM").value;
     if (!tf) return "Over 70 °C: outside the 75 °C correction table. Re-route the conductors.";
     const pick = sizes(m).find(z => AMP75[m][z] * tf * ff >= iMax && AMP75[m][z] >= need);
     const ocpd = STD.find(x => x >= need);
     return `Max circuit current (Isc × 1.25): <b>${num(iMax, 1)} A</b> · continuous (× 1.25 again): <b>${num(need, 1)} A</b><br>
       Correction factors: temperature ${tf} at ${num(t)} °C, conduit fill ${ff}<br>
       <b class="big">Minimum wire: ${pick ? pick + (m === "cu" ? " copper" : " aluminum") : "larger than 500 kcmil"}</b><br>
       Fuse / OCPD if required: ${ocpd} A${pick && OCPD_CAP[m][pick] && ocpd > OCPD_CAP[m][pick] ? ` <span class="err">(exceeds ${OCPD_CAP[m][pick]} A small-conductor limit, go up a size)</span>` : ""}`;
   }},
  {id: "voc", title: "String voltage in cold weather", nec: "NEC 690.7(A)(1) using the module's temperature coefficient",
   html: `<label class="f">Module Voc (V)<input id="vcV" value="41.3"></label><label class="f">Modules in series<input id="vcN" value="12"></label>
     <label class="f">Voc temp coefficient (%/°C)<input id="vcK" value="-0.26"></label><label class="f">Record low temp °C<input id="vcT" value="-12"></label>
     <label class="f">Inverter max DC input (V)<input id="vcMax" value="480"></label>`,
   run() {
     const f = 1 + (v("vcT") - 25) * v("vcK") / 100, vmax = v("vcV") * v("vcN") * f, perMod = v("vcV") * f;
     const most = Math.floor(v("vcMax") / perMod);
     return `<b class="big">${num(vmax, 1)} V max string voltage</b> (cold factor ${num(f, 3)})<br>
       ${vmax > v("vcMax") ? `<span class="err">Too high for the inverter.</span> ` : "Within the inverter limit. "}Most modules in series at this low: <b>${most}</b>
       <div class="note">Use the ASHRAE extreme annual minimum for the site (Raleigh-Durham is about -12 °C). Residential DC limit is 600 V (690.7).</div>`;
   }},
  {id: "busbar", title: "120% busbar rule (backfeed)", nec: "NEC 705.12(B)(3)(2): breaker at the opposite end from the main",
   html: `<label class="f">Busbar rating (A)<input id="bbB" value="200"></label><label class="f">Main breaker (A)<input id="bbM" value="200"></label>
     <label class="f">Inverter output current (A)<input id="bbI" value="32"></label>`,
   run() {
     const allowed = v("bbB") * 1.2 - v("bbM"), need = STD.find(x => x >= v("bbI") * 1.25);
     return `Max solar breaker allowed: <b class="big">${num(allowed)} A</b><br>Breaker this inverter needs (output × 1.25): <b>${need} A</b><br>
       ${need <= allowed ? "Fits: place the solar breaker at the opposite end of the busbar from the main." : `<span class="err">Doesn't fit.</span> Options: derate the main breaker (e.g. ${STD.filter(x => x < v("bbM")).reverse().find(x => v("bbB") * 1.2 - x >= need) || "-"} A main), a supply-side (line-side) connection, or a power control system.`}`;
   }},
  {id: "brk", title: "Inverter breaker size", nec: "NEC 690.9 / 705.30, 240.6(A) standard sizes",
   html: `<label class="f">Inverter AC output (W)<input id="ibW" value="7600"></label><label class="f">Volts<input id="ibV" value="240"></label>`,
   run() { const a = v("ibW") / v("ibV"), b = STD.find(x => x >= a * 1.25); return `Output current ${num(a, 1)} A × 1.25 = ${num(a * 1.25, 1)} A → <b class="big">${b} A breaker</b>`; }},
  {id: "ohm", title: "Ohm's law / power", nec: "Fill in any two, leave the rest blank",
   html: `<label class="f">Volts<input id="ohV" value="240"></label><label class="f">Amps<input id="ohI" value=""></label><label class="f">Ohms<input id="ohR" value=""></label><label class="f">Watts<input id="ohP" value="3600"></label>`,
   run() {
     let V = v("ohV"), I = v("ohI"), R = v("ohR"), P = v("ohP");
     const has = [V, I, R, P].filter(x => !isNaN(x)).length; if (has < 2) return "Enter any two values.";
     if (isNaN(I)) I = !isNaN(V) && !isNaN(R) ? V / R : !isNaN(P) && !isNaN(V) ? P / V : Math.sqrt(P / R);
     if (isNaN(V)) V = !isNaN(R) ? I * R : P / I;
     if (isNaN(R)) R = V / I; if (isNaN(P)) P = V * I;
     return `<b class="big">${num(V, 1)} V · ${num(I, 2)} A · ${num(R, 2)} Ω · ${W(P)}</b>`;
   }},
  {id: "batt", title: "Battery backup runtime", nec: "Usable kWh × ~90% inverter efficiency ÷ load",
   html: `<label class="f">Usable battery kWh<input id="btK" value="13.5"></label><label class="f">Starting charge %<input id="btS" value="100"></label>
     <label class="f">Backup reserve %<input id="btR" value="20"></label><label class="f">Average load (W)<input id="btL" value="1200"></label>`,
   run() {
     const kwh = v("btK") * Math.max(0, v("btS") - v("btR")) / 100 * 0.9, h = kwh * 1000 / v("btL");
     return `<b class="big">${num(h, 1)} hours</b> (${num(kwh, 1)} kWh available)<div class="note">Typical home essentials (fridge, lights, Wi-Fi, outlets) run 500-1,500 W. Central AC or a well pump can double it.</div>`;
   }},
  {id: "prod", title: "Expected production", nec: "System kW × peak sun hours × derate. Raleigh-Durham ≈ 4.6 sun hours/day yearly average.",
   html: `<label class="f">System size (kW DC)<input id="prK" value="8"></label><label class="f">Peak sun hours<input id="prH" value="4.6"></label><label class="f">Derate (losses)<input id="prD" value="0.80"></label>`,
   run() {
     const day = v("prK") * v("prH") * v("prD");
     return `<b class="big">${num(day * 365)} kWh / year</b> · about ${num(day, 1)} kWh/day · midday clear-sky peak around ${num(v("prK") * 0.8, 1)} kW AC
       <div class="note">Real systems vary ±10% by year, tilt, azimuth and shade. Use the Google Solar API (opal-solar roof) for a site-specific number.</div>`;
   }},
];

function tools() {
  $("main").innerHTML = `<h1>Field calculators</h1>
    <p class="sub">Quick checks in the field. Values from the NEC (2020/2023 tables; NC adopts 2023 NEC with amendments that don't change these). Always confirm against your code book, the plans and the manufacturer's specs.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">${CALCS.map(c => `<div class="panel calc"><h2>${esc(c.title)}</h2><div class="fields">${c.html}</div>
      <div class="out" id="out-${c.id}"></div><div class="note">${esc(c.nec)}</div></div>`).join("")}</div>`;
  const runAll = () => CALCS.forEach(c => { try { $("out-" + c.id).innerHTML = c.run(); } catch (e) { $("out-" + c.id).textContent = "Check the inputs."; } });
  $("vdM").onchange = () => { const cur = $("vdS").value; $("vdS").innerHTML = opts(sizes($("vdM").value), sizes($("vdM").value).includes(cur) ? cur : "6"); runAll(); };
  $("main").addEventListener("input", runAll); $("main").addEventListener("change", runAll); runAll();
}

      <label class="f">Theme<select id="stTheme"><option value="">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </div>
      <div class="fields"><label class="f">Panel weight (lb)<input id="stPW" value="${esc(s.panel_lb)}"></label>
